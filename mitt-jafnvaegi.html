﻿<title>Mitt jafnvægi</title>
<style>
/* Layout: one question per screen on a calm column; icon cards to tap; ends in two A4 sheets (a flowchart and a day plan). */
:root {
  --bg: #F4F8F4; --surface: #FFFFFF; --tint: #E6F0E9; --tint2: #F0F5F1; --line: #D3E1D7;
  --ink: #1C2A23; --muted: #5A6B61; --deep: #1B4D3E; --mid: #2E7D5B; --on-deep: #FFFFFF; --sage: #9CC5AC; --gold: #C9A24B; --rose: #C46B5A;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1914; --surface: #15241D; --tint: #1C3328; --tint2: #182B22; --line: #2A4336;
  --ink: #E5EFE8; --muted: #A2B6AA; --deep: #A9D7BB; --mid: #6CC093; --on-deep: #0E1914; --sage: #4E7A62; --gold: #D7B565; --rose: #E08A78; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1914; --surface: #15241D; --tint: #1C3328; --tint2: #182B22; --line: #2A4336;
  --ink: #E5EFE8; --muted: #A2B6AA; --deep: #A9D7BB; --mid: #6CC093; --on-deep: #0E1914; --sage: #4E7A62; --gold: #D7B565; --rose: #E08A78; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); margin: 0 }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 44px }
.screen { display: flex; flex-direction: column; gap: 20px; animation: rise .45s ease both }
@keyframes rise { from { opacity: .001; transform: translateY(10px) } to { opacity: 1; transform: none } }
h1, h2, h3 { font-family: var(--display); font-weight: 500; color: var(--deep); text-wrap: balance; margin: 0 }
h1 { font-size: 2.15rem; line-height: 1.1 }
h2 { font-size: 1.6rem; line-height: 1.18 }
h3 { font-size: 1.15rem; line-height: 1.25 }
p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--mid); outline-offset: 2px }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--mid) }
.muted { color: var(--muted) }
.fine { font-size: .78rem; color: var(--muted); line-height: 1.45 }
sup.r { font-size: .62em; color: var(--mid); font-weight: 700; margin-left: 1px }

/* progress */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.leaves { display: flex; gap: 3px; color: var(--line); font-size: 1.05rem }
.leaves .on { color: var(--mid) }
.leaves .now { color: var(--gold) }
.part { font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }

/* hero */
.hero { position: relative; background: var(--deep); color: var(--on-deep); border-radius: 22px; padding: 26px 22px 22px; overflow: hidden; display: flex; flex-direction: column; gap: 12px }
.hero h1 { color: var(--on-deep); font-size: 2.4rem }
.hero p { opacity: .9 }
.hero .ridge { position: absolute; right: -10px; bottom: -6px; width: 62%; opacity: .32 }
.hero .ridge path { fill: none; stroke: currentColor; stroke-width: 1.4 }
.hero .starm { position: absolute; right: 22px; top: 20px; width: 34px; color: var(--gold) }
.hero .starm line { stroke: currentColor; stroke-width: 1.6; stroke-linecap: round }
.hero * { position: relative }
.what { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.what div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px }
.what .ico { width: 38px; height: 38px; border-radius: 50%; background: var(--tint); color: var(--deep); display: grid; place-items: center; font-size: 1.25rem }
.what b { font-family: var(--display); font-weight: 500; font-size: 1.1rem; color: var(--deep) }
.what span { font-size: .86rem; color: var(--muted) }
.sign { font-family: var(--display); font-style: italic; color: var(--deep); font-size: 1.1rem }

/* option cards */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.grid.one { grid-template-columns: 1fr }
.card { position: relative; display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; transition: border-color .15s, background .15s, transform .15s }
.card.row { flex-direction: row; align-items: center; gap: 14px }
.card .ico { width: 42px; height: 42px; border-radius: 50%; background: var(--tint); color: var(--deep); display: grid; place-items: center; font-size: 1.35rem; transition: background .15s, color .15s }
.card b { font-weight: 600; line-height: 1.3 }
.card small { display: block; color: var(--muted); font-size: .84rem; margin-top: 2px; line-height: 1.35 }
.card .tick { position: absolute; right: 10px; top: 10px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .78rem; font-weight: 700; color: var(--on-deep) }
.card[aria-pressed="true"] { border-color: var(--mid); background: color-mix(in srgb, var(--mid) 7%, var(--surface)) }
.card[aria-pressed="true"] .ico { background: var(--mid); color: var(--on-deep) }
.card[aria-pressed="true"] .tick { background: var(--mid); border-color: var(--mid); animation: pop .25s ease }
@keyframes pop { 0% { transform: scale(.4) } 70% { transform: scale(1.15) } 100% { transform: scale(1) } }
.card:active { transform: scale(.98) }
.group-h { display: flex; align-items: center; gap: 8px; font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px }
.group-h svg { font-size: 1.05rem; color: var(--mid) }
.chips { display: flex; flex-wrap: wrap; gap: 7px }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: .93rem; text-align: left }
.chip[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--on-deep) }
input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600 }
label.f .muted { font-weight: 400; font-size: .86rem }
.count { font-size: .84rem; color: var(--muted) }

/* window-of-tolerance mini */
.wot { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px }
.wot svg { width: 100%; height: auto; display: block }
.wot .band { fill: var(--tint) }
.wot .edge { stroke: var(--sage); stroke-dasharray: 4 4; stroke-width: 1 }
.wot .ln { fill: none; stroke: var(--line); stroke-width: 2.2 }
.wot .ln.on { stroke: var(--mid) }
.wot text { fill: var(--muted); font: 600 10px var(--body); letter-spacing: .08em }
.goal { background: var(--tint); border-radius: 12px; padding: 11px 14px; font-weight: 600; color: var(--deep) }

/* nav */
.nav { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 4px }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--deep); background: var(--deep); color: var(--on-deep); border-radius: 999px; padding: 12px 22px; font-weight: 600 }
.btn.ghost { background: transparent; color: var(--deep) }
.btn.soft { background: var(--tint); border-color: var(--tint); color: var(--deep) }
.btn[disabled] { opacity: .4; cursor: default }
.hint { font-size: .88rem; color: var(--muted); margin-top: -8px }

/* breath orb */
.breath { display: flex; flex-direction: column; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px 16px }
.orb-box { width: 200px; height: 200px; display: grid; place-items: center; position: relative }
.orb { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--sage) 75%, var(--surface)), var(--tint) 70%); border: 2px solid var(--sage); transform: scale(.5); transition-property: transform; transition-timing-function: ease-in-out }
.orb-txt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--display); font-size: 1.45rem; color: var(--deep); pointer-events: none }
.orb-txt small { display: block; font-family: var(--body); font-size: .8rem; color: var(--muted) }

/* result */
.done-hero { text-align: left; display: flex; flex-direction: column; gap: 8px; position: relative }
.spark { position: absolute; right: 6px; top: -4px; color: var(--gold); font-size: 1.6rem; animation: twinkle 2.4s ease-in-out 2 }
@keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.85) rotate(0) } 50% { opacity: 1; transform: scale(1.1) rotate(20deg) } }
.methods { display: flex; flex-direction: column; gap: 10px }
.m { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px }
.m .t { width: 54px; height: 54px; border-radius: 50%; background: var(--deep); color: var(--on-deep); display: grid; place-items: center; text-align: center; font-family: var(--display); line-height: 1; font-size: 1.05rem }
.m .t small { display: block; font-family: var(--body); font-size: .6rem; letter-spacing: .08em; margin-top: 2px }
.m b { display: flex; align-items: center; gap: 6px; font-weight: 600 }
.m b svg { color: var(--mid) }
.m span { font-size: .86rem; color: var(--muted) }
.try { border: 0; background: var(--tint); color: var(--deep); font-weight: 600; font-size: .86rem; border-radius: 999px; padding: 8px 13px; white-space: nowrap }
.actions { display: flex; flex-wrap: wrap; gap: 10px }
.sheets { display: flex; flex-direction: column; gap: 14px }
.preview { width: 100%; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: #fff; box-shadow: 0 8px 28px rgba(20,40,30,.12) }
.preview-inner { transform-origin: top left }
details.refs { background: var(--tint2); border-radius: 12px; padding: 10px 14px }
details.refs summary { cursor: pointer; font-size: .84rem; font-weight: 600; color: var(--muted) }
details.refs ol { margin: 8px 0 2px; padding-left: 20px }

/* sheet modal */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,20,15,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start }
.x { border: 0; background: var(--tint); width: 38px; height: 38px; border-radius: 50%; font-size: 1.05rem; flex: none; color: var(--deep) }
.steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px }
.steps li::marker { color: var(--mid); font-weight: 700 }

@media (prefers-reduced-motion: reduce) { .screen, .card .tick, .spark { animation: none !important } .orb { transition: none !important } }
@media (max-width: 380px) { .grid { grid-template-columns: 1fr } .what { grid-template-columns: 1fr } }

/* ===== A4 sheets (always light) ===== */
.a4 { width: 794px; height: 1123px; background: #FFFFFF; color: #1C2A23; font-family: var(--body); position: relative; overflow: hidden; padding: 50px 58px 40px; display: flex; flex-direction: column }
.a4 svg.i { fill: currentColor }
.a4 .k { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #2E7D5B }
.a4 h1 { font-family: var(--display); font-weight: 500; font-size: 38px; line-height: 1.06; color: #1B4D3E; margin-top: 6px }
.a4 .sub { font-size: 14.5px; color: #4E6157; margin-top: 7px }
.a4 .star { position: absolute; right: 52px; top: 42px; width: 44px; height: 44px }
.a4 sup { font-size: 8px; color: #2E7D5B; font-weight: 700; margin-left: 1px }
.a4 .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px }
.a4 .tag { display: inline-flex; align-items: center; gap: 5px; background: #FFFFFF; border: 1px solid #CFE0D5; border-radius: 999px; padding: 3px 10px 3px 7px; font-size: 12.5px }
.a4 .tag svg { color: #2E7D5B; width: 14px; height: 14px }
.a4 .start { margin-top: 16px; background: #EEF4EF; border-radius: 14px; padding: 12px 16px }
.a4 .start b { color: #1B4D3E; font-size: 14px }
.a4 .vline { width: 2px; background: #9CC5AC; margin-left: 33px; height: 16px; position: relative }
.a4 .vline.arrow::after { content: ""; position: absolute; left: -4px; bottom: -2px; border: 5px solid transparent; border-top: 7px solid #9CC5AC; border-bottom: 0 }
.a4 .stp { display: grid; grid-template-columns: 68px 1fr; gap: 14px; align-items: stretch }
.a4 .tm { width: 68px; height: 68px; border-radius: 50%; background: #1B4D3E; color: #fff; display: grid; place-items: center; text-align: center; font-family: var(--display); font-size: 19px; line-height: 1 }
.a4 .tm small { display: block; font-family: var(--body); font-size: 8.5px; letter-spacing: .1em; margin-top: 3px; opacity: .85 }
.a4 .sc { border: 1px solid #D3E1D7; border-radius: 14px; padding: 12px 16px 12px }
.a4 .sc .hd { display: flex; align-items: center; gap: 8px }
.a4 .sc .hd svg { width: 22px; height: 22px; color: #2E7D5B }
.a4 .sc h3 { font-family: var(--display); font-weight: 500; font-size: 20px; color: #1B4D3E }
.a4 .sc .lab { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #6B7A71 }
.a4 .sc ul { margin: 5px 0 0; padding-left: 17px; font-size: 13px; line-height: 1.42 }
.a4 .sc .why { font-size: 10.5px; color: #6B7A71; margin-top: 4px }
.a4 .dec { display: grid; grid-template-columns: 68px 1fr; gap: 14px; align-items: center; height: 50px }
.a4 .dec .l { position: relative; height: 100%; }
.a4 .dec .l::before { content: ""; position: absolute; left: 33px; top: 0; bottom: 0; width: 2px; background: #9CC5AC }
.a4 .dec .l::after { content: ""; position: absolute; left: 29px; bottom: -2px; border: 5px solid transparent; border-top: 7px solid #9CC5AC; border-bottom: 0 }
.a4 .dec .l span { position: absolute; left: 42px; top: 16px; font-size: 10.5px; font-weight: 700; color: #6B7A71; letter-spacing: .06em }
.a4 .yes { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: #1B4D3E }
.a4 .yes .q { background: #FFFFFF; border: 1.5px solid #9CC5AC; border-radius: 8px; padding: 3px 9px; font-weight: 700; transform: none }
.a4 .yes .ok { background: #E3EFE7; border-radius: 999px; padding: 3px 11px; font-weight: 600 }
.a4 .end { border: 1.5px dashed #9CC5AC; border-radius: 14px; padding: 11px 16px; font-size: 13.5px }
.a4 .end b { color: #1B4D3E }
.a4 .sent { margin-top: 24px; background: #1B4D3E; color: #fff; border-radius: 16px; padding: 14px 20px; display: flex; align-items: center; gap: 14px }
.a4 .sent .k { color: #9CC5AC }
.a4 .sent .q { font-family: var(--display); font-style: italic; font-size: 25px; line-height: 1.2 }
.a4 .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid #E1EAE4; display: flex; flex-direction: column; gap: 3px; font-size: 9.5px; color: #6B7A71; line-height: 1.4 }
.a4 .foot .refs { display: flex; flex-wrap: wrap; gap: 0 12px }
.a4 .day { margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; position: relative }
.a4 .day::before { content: ""; position: absolute; left: 12%; right: 12%; top: 25px; height: 2px; background: #CFE0D5 }
.a4 .col { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative }
.a4 .col .dot { width: 52px; height: 52px; border-radius: 50%; background: #FFFFFF; border: 2px solid #9CC5AC; display: grid; place-items: center; color: #1B4D3E }
.a4 .col .dot svg { width: 26px; height: 26px }
.a4 .col h3 { font-family: var(--display); font-weight: 500; font-size: 17px; color: #1B4D3E }
.a4 .col .it { width: 100%; background: #EEF4EF; border-radius: 10px; padding: 7px 9px; font-size: 12px; line-height: 1.35 }
.a4 .col .it b { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #2E7D5B; margin-bottom: 1px }
.a4 .col .it.empty { background: transparent; border: 1px dashed #D3E1D7; color: #8A988F; text-align: center }
.a4 .sec { margin-top: 14px }
.a4 .sec h2 { font-family: var(--display); font-weight: 500; font-size: 20px; color: #1B4D3E; margin-bottom: 6px }
.a4 .nour { display: flex; flex-wrap: wrap; gap: 7px }
.a4 .nour span { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #CFE0D5; border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px }
.a4 .nour svg { width: 16px; height: 16px; color: #2E7D5B }
.a4 .first { margin-top: 16px; background: #EEF4EF; border-radius: 14px; padding: 11px 16px; font-size: 14px }
.a4 .first b { color: #1B4D3E }
.a4 table { width: 100%; border-collapse: collapse; font-size: 12.5px }
.a4 th { font-weight: 600; color: #5A6B61; font-size: 10.5px; text-align: center; padding: 3px 0 }
.a4 th:first-child { text-align: left }
.a4 td { border-top: 1px solid #E1EAE4; padding: 5px 0 }
.a4 td.d { width: 32px; text-align: center }
.a4 td.d span { display: inline-block; width: 15px; height: 15px; border: 1.3px solid #9CC5AC; border-radius: 4px }
.a4 .quote { margin-top: 14px; font-family: var(--display); font-style: italic; font-size: 17px; color: #1B4D3E; text-align: center }
.a4 .hdr { margin: -50px -58px 0; padding: 44px 58px 24px; background: #EEF4EF; position: relative; overflow: hidden }
.a4 .hdr > * { position: relative }
.a4 .hdr .ridge { position: absolute; right: 0; bottom: 0; width: 420px; height: 120px; opacity: .55 }
.a4 .hdr .ridge path { fill: none; stroke: #9CC5AC; stroke-width: 1.3 }
.a4 .hdr .star { position: absolute; top: 30px; right: 52px }
.a4 .hrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px }
.a4 .mywin { flex: none; width: 190px; background: rgba(255,255,255,.75); border: 1px solid #D3E1D7; border-radius: 14px; padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 4px }
.a4 .mywin svg { width: 170px; height: 104px }
.a4 .mywin span { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #2E7D5B; text-align: center }
.a4 .start { background: #FFFFFF; border: 1px solid #D3E1D7 }
.a4 .tm { box-shadow: 0 0 0 5px #DCEBE1 }
.a4 .col .dot { background: #EEF4EF }
.a4 .note2 { font-size: 10.5px; color: #6B7A71; margin-top: 8px }
.a4 .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.a4 .mi { display: flex; align-items: center; gap: 9px; border: 1px solid #D3E1D7; border-radius: 12px; padding: 6px 10px }
.a4 .mi .mc { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #EEF4EF; color: #1B4D3E; display: grid; place-items: center }

<script>
(function () {

  }
  function fitPreviews() {
    $$(".preview").forEach(function (pv) { var inner = $(".preview-inner", pv), k = pv.clientWidth / 794; inner.style.transform = "scale(" + k + ")"; pv.style.height = (1123 * k) + "px"; });
  }
  window.addEventListener("resize", function () { if (Q[step].key === "result") fitPreviews(); });

  // ---------- PDF ----------
  function loadScript(src) {
    return new Promise(function (res, rej) {
      if (document.querySelector('script[src="' + src + '"]')) return res();
      var s = document.createElement("script"); s.src = src; s.onload = function () { res(); }; s.onerror = function () { rej(new Error("load")); };
      document.head.appendChild(s);
    });
  }
  function saveBlob(blob, name) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  var downloadsP = (window.claude && window.claude.use) ? window.claude.use("downloads") : Promise.resolve(null);
  function downloadPdf() {
    var btn = $("#dl"), msg = $("#dl-msg"), zone = $("#render-zone");
    btn.disabled = true; msg.textContent = "Bý til PDF …";
    zone.innerHTML = sheet1() + sheet2();
    Promise.all([
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"),
      document.fonts ? document.fonts.ready : Promise.resolve()
    ]).then(function () {
      return $$(".a4", zone).reduce(function (acc, el) {
        return acc.then(function (list) { return window.html2canvas(el, { scale: 2, backgroundColor: "#FFFFFF" }).then(function (c) { list.push(c); return list; }); });
      }, Promise.resolve([]));
    }).then(function (canvases) {
      var pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
      canvases.forEach(function (c, k) { if (k) pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297); });
      var blob = pdf.output("blob");
      return downloadsP.then(function (dl) {
        if (!dl) { saveBlob(blob, "Mitt jafnvægi" + (A.name.trim() ? " - " + A.name.trim() : "") + ".pdf"); msg.textContent = "PDF sótt. Opnaðu það til að prenta."; return; }
        var fname = "Mitt jafnvægi" + (A.name.trim() ? " - " + A.name.trim() : "") + ".pdf";
        return dl.save({ filename: fname, data: blob }).then(function () { msg.textContent = "PDF vistað. Opnaðu það til að prenta."; }, function (e) {
          var code = e && e.code;
          msg.textContent = code === "declined" ? "Hætt við niðurhal." : code === "rate_limited" ? "Bíddu andartak og reyndu aftur." : "Niðurhal tókst ekki hér. Taktu skjáskot af blöðunum í staðinn.";
        });
      });
    }).catch(function () { msg.textContent = "Ekki tókst að búa til PDF. Taktu skjáskot af blöðunum hér fyrir neðan í staðinn."; })
      .then(function () { btn.disabled = false; zone.innerHTML = ""; });
  }

  render();
})();
</script>
